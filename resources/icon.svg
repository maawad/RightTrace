<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" fill="#151821"/>

  <!-- Subtle inner border -->
  <rect x="10" y="10" width="108" height="108"
        fill="none" stroke="#262A38" stroke-width="2"/>

  <!-- Timeline bars -->
  <rect x="24" y="34" width="80" height="10" rx="5" fill="#00D8FF"/>
  <rect x="24" y="56" width="62" height="10" rx="5" fill="#A855F7"/>
  <rect x="24" y="78" width="92" height="10" rx="5" fill="#22C55E"/>

  <!-- Playhead line (same visual thickness as bars) -->
  <line x1="64" y1="26" x2="64" y2="102"
        stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Playhead handle (match bar thickness) -->
  <polygon points="64,16 52,32 76,32" fill="#FFFFFF" opacity="0.95"/>
</svg>

